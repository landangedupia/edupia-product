      Plus" chỉ là tên thành phần con (buổi học) của sản phẩm mẹ đó, không phải tên cạnh tranh. Hạ mức xuống minor vì
      PRD hiện chưa dẫn chiếu rõ tới xác nhận đã có sẵn này, dễ gây hiểu lầm cho người đọc mới.
    suggestion: >-
