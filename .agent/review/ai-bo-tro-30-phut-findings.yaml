    quote: "giá trị tổng hợp toàn môn, đa buổi, có decay"
    finding: "Thuộc tính 'có decay' (mastery suy giảm theo thời gian) được khẳng định ở Quy ước nhưng không được BR3 hay bất kỳ Business Rule nào khác nhắc lại hay vận dụng. Không rõ decay có ảnh hưởng tới việc phân chân dung ngay sau khi buổi Big Class Plus vừa kết thúc hay không — rủi ro học sinh lâu ngày ít học bị decay kéo mastery xuống, dẫn tới phân chân dung sai dù vừa thể hiện tốt ở buổi liền trước."
    suggestion: "Làm rõ trong BR3 liệu giá trị mastery dùng để phân chân dung đã phản ánh đầy đủ kết quả buổi vừa xong hay còn chịu độ trễ do decay; nếu có rủi ro, bổ sung quy tắc ưu tiên tín hiệu buổi gần nhất, hoặc bỏ chi tiết decay khỏi Quy ước nếu không áp dụng cho luồng này."
    resolution_edge_cases:
